#============================================================================================
# https://github.com/ophub/amlogic-s9xxx-openwrt
# Description: Build OpenWrt
#============================================================================================

name: 通用设备编译固件

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      source_branch:
        description: "Select the source branch"
        required: false
        default: "openwrt-main"
        type: choice
        options:
          - openwrt-main
          - lede-master
          - immortalwrt-master
          - Lienol-master

env:
  FEEDS_CONF: config/${{ inputs.source_branch }}/feeds.conf.default
  CONFIG_FILE: config/${{ inputs.source_branch }}/config
  DIY_P1_SH: config/${{ inputs.source_branch }}/diy-part1.sh
  DIY_P2_SH: config/${{ inputs.source_branch }}/diy-part2.sh
  UPLOAD_BIN_DIR: true
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    if: ${{ github.event.repository.owner.id == github.event.sender.id }}

    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Initialization environment
        id: init
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          docker images -q | xargs -r docker rmi
          [[ -n "${AGENT_TOOLSDIRECTORY}" ]] && sudo rm -rf "${AGENT_TOOLSDIRECTORY}"
          sudo rm -rf /usr/share/dotnet /etc/apt/sources.list.d /usr/local/lib/android 2>/dev/null
          sudo -E apt-get -y update
          sudo -E apt-get -y purge azure-cli ghc* zulu* llvm* firefox google* dotnet* powershell openjdk* mongodb* moby* || true
          sudo -E apt-get -y install $(curl -fsSL https://is.gd/depend_ubuntu2204_openwrt)
          sudo -E systemctl daemon-reload
          # sudo -E apt-get -y full-upgrade
          sudo -E apt-get -y autoremove --purge
          sudo -E apt-get clean
          sudo mkdir -p /workdir
          sudo chown ${USER}:${GROUPS} /workdir
          sudo timedatectl set-timezone "${TZ}"
          echo "status=success" >> "$GITHUB_OUTPUT"

      - name: Clone source code [ ${{ inputs.source_branch }} ]
        id: codes
        working-directory: /workdir
        if: ${{ steps.init.outputs.status == 'success' && !cancelled() }}
        run: |
          # Set up compilation source code
          if [[ "${{ inputs.source_branch }}" == *"openwrt"* ]]; then
              REPO_URL="https://github.com/openwrt/openwrt"
              REPO_BRANCH="main"
              TAGS_NAME="official"
          elif [[ "${{ inputs.source_branch }}" == *"lede"* ]]; then
              REPO_URL="https://github.com/coolsnowwolf/lede"
              REPO_BRANCH="master"
              TAGS_NAME="lede"
          elif [[ "${{ inputs.source_branch }}" == *"immortalwrt"* ]]; then
              REPO_URL="https://github.com/immortalwrt/immortalwrt"
              REPO_BRANCH="master"
              TAGS_NAME="immortalwrt"
          elif [[ "${{ inputs.source_branch }}" == *"Lienol"* ]]; then
              REPO_URL="https://github.com/Lienol/openwrt"
              REPO_BRANCH="22.03"
              TAGS_NAME="Lienol"
          else
              echo "Unknown source code repository."
              exit 1
          fi

          # Clone source code
          git clone -q --single-branch --depth=1 --branch="${REPO_BRANCH}" "${REPO_URL}" openwrt
          ln -sf /workdir/openwrt "${GITHUB_WORKSPACE}/openwrt"

          # Set output information
          echo "build_tag=OpenWrt_${TAGS_NAME}_${{ inputs.openwrt_storage }}_$(date +"%Y.%m")" >> "$GITHUB_OUTPUT"
          echo -e "REPO_URL: [ ${REPO_URL} ]\nREPO_BRANCH: [ ${REPO_BRANCH} ]\nTAGS_NAME: [ ${TAGS_NAME} ]"
          df -hT "${PWD}"
          echo "status=success" >> "$GITHUB_OUTPUT"

      - name: Load custom feeds
        run: |
          [[ -f "${FEEDS_CONF}" ]] && cp -f "${FEEDS_CONF}" openwrt/feeds.conf.default
          chmod +x "${DIY_P1_SH}"
          cd openwrt/
          "${GITHUB_WORKSPACE}/${DIY_P1_SH}"

      - name: Update feeds
        run: cd openwrt/ && ./scripts/feeds update -a

      - name: Install feeds
        run: cd openwrt/ && ./scripts/feeds install -a

      - name: Load custom configuration
        run: |
          [[ -d "files" ]] && mv -f files openwrt/files
          [[ -e "${CONFIG_FILE}" ]] && cp -f "${CONFIG_FILE}" openwrt/.config
          chmod +x "${DIY_P2_SH}"
          cd openwrt/
          "${GITHUB_WORKSPACE}/${DIY_P2_SH}"

      - name: Download package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          cd openwrt/

          make defconfig

          echo "Selected OpenWrt target:"
          grep -E '^CONFIG_TARGET|^CONFIG_TARGET_BOARD|^CONFIG_TARGET_SUBTARGET|^CONFIG_TARGET_PROFILE' .config || true

          make download -j8

          find dl -size -1024c -exec ls -l {} \; || true
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile the OpenWrt
        id: compile
        shell: bash
        run: |
          set -euo pipefail
          cd openwrt/

          echo "$(nproc) thread compile"
          make -j"$(($(nproc) + 1))" V=s

          echo "Build completed. Checking image output..."
          find bin -maxdepth 4 -type d -print | sort || true
          find bin/targets -maxdepth 4 -type f -printf '%p\n' | sort || true

          shopt -s nullglob
          target_dirs=(bin/targets/*/*)

          if (( ${#target_dirs[@]} == 0 )); then
            echo "ERROR: make exited successfully, but no firmware was generated in bin/targets/."
            echo "Current target selections:"
            grep -E '^CONFIG_TARGET|^CONFIG_TARGET_BOARD|^CONFIG_TARGET_SUBTARGET' .config || true
            exit 1
          fi

          echo "status=success" >> "$GITHUB_OUTPUT"

      - name: Check space usage
        if: ${{ !cancelled() }}
        run: df -hT

      - name: Upload bin directory
        uses: actions/upload-artifact@main
        if: ${{ steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true' }}
        with:
          name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
          path: openwrt/bin

      - name: Organize files
        id: organize
        if: ${{ env.UPLOAD_FIRMWARE == 'true' && !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          echo "Checking OpenWrt build outputs..."
          echo "Selected target in .config:"
          grep -E '^CONFIG_TARGET|^CONFIG_TARGET_BOARD|^CONFIG_TARGET_SUBTARGET' openwrt/.config || true

          if [[ ! -d "openwrt/bin" ]]; then
            echo "ERROR: openwrt/bin does not exist. The compile step did not produce build output."
            exit 1
          fi

          echo "Contents of openwrt/bin:"
          find openwrt/bin -maxdepth 4 -type d -print | sort || true
          echo "Files under openwrt/bin:"
          find openwrt/bin -maxdepth 5 -type f -printf '%p\n' | sort | head -n 200 || true

          target_dirs=(openwrt/bin/targets/*/*)

          if (( ${#target_dirs[@]} == 0 )); then
            echo "ERROR: No firmware target directory was created under openwrt/bin/targets/."
            echo "Check the earlier compile log for 'Error', 'failed', 'No rule to make target', or an invalid CONFIG_TARGET."
            exit 1
          fi

          if (( ${#target_dirs[@]} > 1 )); then
            echo "ERROR: More than one firmware target directory was found:"
            printf '%s\n' "${target_dirs[@]}"
            exit 1
          fi

          FIRMWARE_DIR="$(realpath "${target_dirs[0]}")"
          rm -rf "${FIRMWARE_DIR}/packages"

          echo "FIRMWARE=${FIRMWARE_DIR}" >> "$GITHUB_ENV"
          echo "status=success" >> "$GITHUB_OUTPUT"

          echo "Firmware directory: ${FIRMWARE_DIR}"
          echo "Firmware files:"
          find "${FIRMWARE_DIR}" -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Upload firmware directory
        uses: actions/upload-artifact@main
        if: ${{ steps.organize.outputs.status == 'success' && !cancelled() }}
        with:
          name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
          path: ${{ env.FIRMWARE }}

      - name: Generate release tag
        id: tag
        if: ${{ env.UPLOAD_RELEASE == 'true' && !cancelled() }}
        run: |
          echo "release_tag=$(date +"%Y.%m.%d-%H%M")" >> "$GITHUB_OUTPUT"
          touch release.txt
          [ "${UPLOAD_COWTRANSFER}" = true ] && echo "🔗 [Cowtransfer](${{ steps.cowtransfer.outputs.url }})" >> release.txt
          [ "${UPLOAD_WETRANSFER}" = true ] && echo "🔗 [WeTransfer](${{ steps.wetransfer.outputs.url }})" >> release.txt
          echo "status=success" >> "$GITHUB_OUTPUT"

      - name: Upload firmware to release
        uses: softprops/action-gh-release@v1
        if: ${{ steps.tag.outputs.status == 'success' && !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          body_path: release.txt
          files: ${{ env.FIRMWARE }}/*

      - name: Delete workflow runs
        uses: GitRML/delete-workflow-runs@main
        with:
          retain_days: 1
          keep_minimum_runs: 3
          token: ${{ secrets.GH_TOKEN }}
          body: |
            ### OpenWrt Image information
            - Default IP: 192.168.1.1
            - Default username: root
            - Default password: password
            - Default WIFI name: OpenWrt
            - Default WIFI password: none
            ### Install to EMMC
            - Login to OpenWrt → System → Amlogic Service → Install OpenWrt
            ### OpenWrt Image Verification
            - sha256sum
